name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check supported feature sets
        run: |
          cargo check --locked --all-targets --no-default-features
          cargo check --locked --all-targets --no-default-features --features tls-native
          cargo check --locked --all-targets --all-features
      - run: git diff --check

  freebsd:
    name: FreeBSD 14.4 tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test in FreeBSD
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          release: "14.4"
          sync: rsync
          copyback: false
          prepare: pkg install -y rustup-init
          run: |
            set -eu
            freebsd-version
            rustup-init -y --profile minimal --default-toolchain 1.88.0
            . "$HOME/.cargo/env"
            rustc --version
            cargo --version
            cargo test --locked
