name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux source checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check supported feature sets
        run: |
          cargo check --locked --all-targets --no-default-features
          cargo check --locked --all-targets --no-default-features --features tls-native
          cargo check --locked --all-targets --all-features
      - run: git diff --check

  freebsd:
    name: FreeBSD 14.4 ${{ matrix.arch }} tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-freebsd
            rust_sha256: 88393111151774fc14914198805130fc7c07dd7298484e3d14721d7f2958f85e
          - arch: aarch64
            target: aarch64-unknown-freebsd
            rust_sha256: 783c2983b9e1f6c4f9bebb96a459df46903a7f63fcfc20c6ef2524f0f959776e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test in FreeBSD
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          release: "14.4"
          arch: ${{ matrix.arch }}
          sync: rsync
          copyback: false
          run: |
            set -eu
            freebsd-version
            rust_archive="rust-1.98.0-${{ matrix.target }}.tar.xz"
            fetch "https://static.rust-lang.org/dist/${rust_archive}"
            test "$(sha256 -q "${rust_archive}")" = "${{ matrix.rust_sha256 }}"
            tar --no-same-owner -xf "${rust_archive}"
            sh "${rust_archive%.tar.xz}/install.sh" \
              --prefix="$HOME/.local" \
              --without=rust-docs \
              --disable-ldconfig
            export PATH="$HOME/.local/bin:$PATH"
            rustc --version
            cargo --version
            rustc -vV | grep "host: ${{ matrix.target }}"
            cargo test --locked
